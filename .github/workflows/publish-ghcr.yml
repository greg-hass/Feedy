name: Publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: greg-hass/feedy

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate container entrypoint
        run: test -x docker/entrypoint.sh

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://validation:validation@localhost:5432/feedy?schema=public
        run: npx prisma validate

      # The shipped image installs with --omit=dev (see Dockerfile), so the
      # blocking audit covers production dependencies only. Dev-only chains
      # (e.g. eslint → minimatch@3 → brace-expansion@1.x) currently have
      # advisories with no non-breaking fix; the full audit below keeps them
      # visible without blocking the build.
      - name: Audit dependencies
        run: npm audit --audit-level=low --omit=dev

      - name: Audit all dependencies (informational)
        run: npm audit --audit-level=low || true

      - name: Build application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker metadata
        id: meta
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          sha_tag="sha-${GITHUB_SHA::7}"
          version="$sha_tag"

          {
            echo "tags<<EOF"
            if [ "$IS_DEFAULT_BRANCH" = "true" ]; then
              echo "$IMAGE:latest"
              version="latest"
            fi
            echo "$IMAGE:$sha_tag"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            echo "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "org.opencontainers.image.version=$version"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
